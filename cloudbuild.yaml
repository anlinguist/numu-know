# Cloud Build configuration for Cloud Run deployment with Firebase secrets
# Automatically deploys to different services based on branch:
# - staging branch -> staging-numu-know
# - main branch -> numu-know

# Set _SERVICE_NAME in your Cloud Build trigger settings:
# - Staging trigger: _SERVICE_NAME=staging-numu-know
# - Main trigger: _SERVICE_NAME=numu-know
substitutions:
  _SERVICE_NAME: 'numu-know'   # Default to production
  _REGION: 'us-central1'        # Change to your region if different

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$BRANCH_NAME'
      - '--build-arg'
      - NEXT_PUBLIC_FIREBASE_API_KEY=$$NEXT_PUBLIC_FIREBASE_API_KEY
      - '--build-arg'
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
      - '--build-arg'
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=$$NEXT_PUBLIC_FIREBASE_PROJECT_ID
      - '--build-arg'
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$$NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
      - '--build-arg'
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$$NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
      - '--build-arg'
      - NEXT_PUBLIC_FIREBASE_APP_ID=$$NEXT_PUBLIC_FIREBASE_APP_ID
      - '--build-arg'
      - NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=$$NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
      - '.'
    secretEnv:
      - 'NEXT_PUBLIC_FIREBASE_API_KEY'
      - 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN'
      - 'NEXT_PUBLIC_FIREBASE_PROJECT_ID'
      - 'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET'
      - 'NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID'
      - 'NEXT_PUBLIC_FIREBASE_APP_ID'
      - 'NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}'

  # Deploy container image to Cloud Run (only for staging and main branches)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy'
    entrypoint: bash
    args:
      - '-c'
      - |
        if [[ "$BRANCH_NAME" == "staging" || "$BRANCH_NAME" == "main" ]]; then
          echo "Deploying to ${_SERVICE_NAME}..."
          gcloud run deploy ${_SERVICE_NAME} \
            --image gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA \
            --region ${_REGION} \
            --platform managed \
            --allow-unauthenticated \
            --update-secrets=ALGOLIA_APP_ID=algolia-app-id:latest \
            --update-secrets=ALGOLIA_API_KEY=algolia-api-key:latest \
            --update-secrets=KLAVIYO_API_KEY=klaviyo-api-key:latest \
            --update-secrets=YOUTUBE_API_KEY=youtube-api-key:latest \
            --update-secrets=WORDPRESS_BLOG_URL=wordpress-blog-url:latest \
            --update-secrets=NEXT_PUBLIC_FIREBASE_API_KEY=next-public-firebase-api-key:latest \
            --update-secrets=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=next-public-firebase-auth-domain:latest \
            --update-secrets=NEXT_PUBLIC_FIREBASE_PROJECT_ID=next-public-firebase-project-id:latest \
            --update-secrets=NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=next-public-firebase-storage-bucket:latest \
            --update-secrets=NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=next-public-firebase-messaging-sender-id:latest \
            --update-secrets=NEXT_PUBLIC_FIREBASE_APP_ID=next-public-firebase-app-id:latest \
            --update-secrets=NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=next-public-firebase-measurement-id:latest \
            --set-env-vars=NODE_ENV=production
        else
          echo "Branch '$BRANCH_NAME' is not staging or main - skipping deployment"
          echo "Build completed successfully but not deployed to Cloud Run"
        fi

# Reference secrets from Secret Manager
availableSecrets:
  secretManager:
    # Public Firebase config (these are safe to expose in client bundles)
    - versionName: projects/$PROJECT_ID/secrets/next-public-firebase-api-key/versions/latest
      env: 'NEXT_PUBLIC_FIREBASE_API_KEY'
    - versionName: projects/$PROJECT_ID/secrets/next-public-firebase-auth-domain/versions/latest
      env: 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN'
    - versionName: projects/$PROJECT_ID/secrets/next-public-firebase-project-id/versions/latest
      env: 'NEXT_PUBLIC_FIREBASE_PROJECT_ID'
    - versionName: projects/$PROJECT_ID/secrets/next-public-firebase-storage-bucket/versions/latest
      env: 'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET'
    - versionName: projects/$PROJECT_ID/secrets/next-public-firebase-messaging-sender-id/versions/latest
      env: 'NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID'
    - versionName: projects/$PROJECT_ID/secrets/next-public-firebase-app-id/versions/latest
      env: 'NEXT_PUBLIC_FIREBASE_APP_ID'
    - versionName: projects/$PROJECT_ID/secrets/next-public-firebase-measurement-id/versions/latest
      env: 'NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID'

images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$BRANCH_NAME'

options:
  logging: CLOUD_LOGGING_ONLY
