# factory.yaml: spec docs/FACTORY-YAML.md in anlinguist/globalhost; check with `globalhost validate`
# yaml-language-server: $schema=https://raw.githubusercontent.com/anlinguist/globalhost/main/schemas/factory.schema.json
version: 1
product: numu-know
owners:
  - { login: anlinguist, id: 47403803 }
autonomy: L1

git:
  defaultBranch: main
  baseBranch: main

parts:
  web:
    path: .
    profile: web-app
    config:
      routes: ["/", "/dictionary", "/learn", "/store"]
      # The dev Firebase project's web config (public by design; it ships in the site's JavaScript). CI, agent
      # runs and previews build with it, so they never touch production. Seed data: `npm run seed:dev`.
      previewEnv:
        NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyCYwlIwoUS_r2mLjaH0qn-sl41ekgX0Jb4
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: numu-know-dev.firebaseapp.com
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: numu-know-dev
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: numu-know-dev.firebasestorage.app
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "414694776649"
        NEXT_PUBLIC_FIREBASE_APP_ID: "1:414694776649:web:2c7de149ad418bb29f4498"
    preview: { enabled: false }   # previews arrive with P1-11

limits:
  maxConcurrentBuilders: 1
  perRunUsd: 4
  perRunMinutes: 45
  dailyUsd: 20

guardrails:
  loadBearing: ["proxy.ts", "lib/firebase*", "cloudbuild.yaml", "Dockerfile", "firestore.rules", "seed/seed-dev.mjs"]
  immutable: []
