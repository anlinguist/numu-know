# factory.yaml: spec docs/FACTORY-YAML.md in anlinguist/globalhost; check with `globalhost validate`
# yaml-language-server: $schema=https://raw.githubusercontent.com/anlinguist/globalhost/main/schemas/factory.schema.json
version: 1
product: numu-know
owners:
  - { login: anlinguist, id: 47403803 }
autonomy: L1

git:
  defaultBranch: main
  baseBranch: main

# Prod is only named so previews can be refused if their config points at it (preview_config_names_prod).
environments:
  prod: { gcpProject: numu-know, region: us-central1 }
  dev: { gcpProject: numu-know-dev, region: us-central1 }

parts:
  web:
    path: .
    profile: web-app
    config:
      routes: ["/", "/dictionary", "/learn", "/store"]
      # The dev Firebase project's web config (public by design; it ships in the site's JavaScript). CI, agent
      # runs and previews build with it, so they never touch production. Seed data: `npm run seed:dev`.
      previewEnv:
        NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyCYwlIwoUS_r2mLjaH0qn-sl41ekgX0Jb4
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: numu-know-dev.firebaseapp.com
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: numu-know-dev
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: numu-know-dev.firebasestorage.app
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "414694776649"
        NEXT_PUBLIC_FIREBASE_APP_ID: "1:414694776649:web:2c7de149ad418bb29f4498"
    # https://numu-know-web-pr-<n>.globalhost.ai per PR (.github/workflows/globalhost-preview.yml)
    preview: { enabled: true }
    # Prod still deploys through the existing Cloud Build trigger; globalhost only watches it (globalhost-release.yml).
    release:
      - adapter: cloud-build-trigger
        config:
          project: numu-know
          trigger: rmgpgab-numu-know-us-central1-anlinguist-Numu-Know--mafyn
          region: global
          # The Cloud Run service www.numu-know.com serves; the observer checks it runs the merged commit.
          cloudRun: { service: numu-know, region: us-central1 }

limits:
  maxConcurrentBuilders: 1
  perRunUsd: 4
  perRunMinutes: 45
  dailyUsd: 20

guardrails:
  loadBearing: ["proxy.ts", "lib/firebase*", "cloudbuild.yaml", "Dockerfile", "firestore.rules", "seed/seed-dev.mjs", ".github/preview-tools/**"]
  immutable: []
